<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowTask — Không gian làm việc cá nhân</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#738096;--line:#e7ebf2;--primary:#6558e8;--primary2:#5145d0;--green:#19a974;--red:#d94b65;--shadow:0 12px 35px #1d2b4910}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650}
.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.ghost{background:#f0efff;color:var(--primary)}.danger{background:#fff0f2;color:var(--red)}.muted{color:var(--muted)}.hidden{display:none!important}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,#e8e6ff,transparent 35%),radial-gradient(circle at 80% 80%,#dff8f0,transparent 30%),var(--bg)}
.auth-card{width:min(440px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:11px;font-weight:850;font-size:22px;letter-spacing:-.7px}.logo-mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#776af4,#5145d0);display:grid;place-items:center;color:white;font-size:20px}
.auth-card h1{font-size:28px;letter-spacing:-1px;margin:26px 0 8px}.auth-card p{color:var(--muted);line-height:1.55}
.field{display:flex;flex-direction:column;gap:7px;margin:15px 0}.field label{font-size:13px;font-weight:700;color:#48536a}.field input,.field textarea,.field select,.search{width:100%;border:1px solid #dfe4ee;background:#fff;border-radius:10px;padding:12px 13px;outline:none;color:var(--ink)}.field input:focus,.field textarea:focus,.field select:focus,.search:focus{border-color:var(--primary);box-shadow:0 0 0 3px #6558e81a}.auth-card .primary{width:100%;padding:13px;margin-top:6px}.switch{text-align:center;font-size:14px;margin-top:18px}.link{color:var(--primary);font-weight:750;cursor:pointer}.error{color:var(--red);font-size:13px;margin-top:10px}.hint{font-size:12px;color:var(--muted);margin-top:12px}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:25px 17px;display:flex;flex-direction:column;gap:26px}.sidebar .logo{padding:0 9px}.nav-label{text-transform:uppercase;letter-spacing:1.3px;font-size:10px;color:#9aa3b3;font-weight:800;padding:0 12px;margin-bottom:8px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;color:#69758b;padding:12px;border-radius:11px}.nav button.active{background:#f0efff;color:var(--primary)}.nav .ico{font-size:18px;width:23px;text-align:center}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0}.user-email{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin:7px 0 12px}
.main{min-width:0}.topbar{height:78px;background:#ffffffc9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:18px}.topbar h2{margin:0;font-size:20px;letter-spacing:-.5px}.top-right{display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;background:#e8e6ff;color:var(--primary);border-radius:50%;display:grid;place-items:center;font-weight:800}
.content{padding:30px 36px;max-width:1400px;margin:auto}.welcome{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:26px}.welcome h1{font-size:29px;letter-spacing:-1.1px;margin:0 0 7px}.welcome p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:27px}.stat,.panel,.item-card{background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:20px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.stat-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:11px;background:#f0efff;font-size:17px}.stat-num{font-size:30px;font-weight:850;letter-spacing:-1px;margin-top:12px}.stat-sub{font-size:12px;color:var(--muted);margin-top:3px}.panel{padding:22px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.panel-head h3{margin:0;font-size:16px}.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.task-list,.item-list{display:flex;flex-direction:column;gap:10px}.task-row{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #f0f2f6}.task-row:last-child{border:0}.check{width:19px;height:19px;accent-color:var(--primary);margin-top:2px}.task-title{font-weight:700;font-size:14px}.task-title.done{text-decoration:line-through;color:#9ba4b2}.task-meta{font-size:12px;color:var(--muted);margin-top:5px}.tag{display:inline-flex;align-items:center;border-radius:7px;padding:4px 7px;font-size:11px;font-weight:750;background:#f0efff;color:var(--primary)}.tag.high{background:#fff0f2;color:var(--red)}.tag.low{background:#e7f8f0;color:#13875c}.mini-actions{margin-left:auto;display:flex;gap:5px}.icon-btn{background:transparent;color:#8c96a7;padding:5px 7px}.icon-btn:hover{background:#f3f4f8;color:var(--ink)}.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.page-head h1{margin:0;font-size:26px;letter-spacing:-.8px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.filters .search{max-width:310px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.item-card{padding:19px;min-width:0}.item-card h3{margin:12px 0 7px;font-size:16px;overflow-wrap:anywhere}.item-card p{color:var(--muted);font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding-top:12px;border-top:1px solid var(--line);gap:8px}.progress{height:7px;background:#eef0f6;border-radius:20px;overflow:hidden;margin:13px 0}.progress span{height:100%;display:block;background:linear-gradient(90deg,#8d82ff,#5b4fe0);border-radius:20px}.habit-row{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}.habit-row:last-child{border:0}.habit-emoji{width:43px;height:43px;border-radius:14px;background:#f0efff;display:grid;place-items:center;font-size:20px}.habit-info{flex:1}.habit-info strong{font-size:14px}.habit-info p{font-size:12px;color:var(--muted);margin:4px 0 0}.habit-days{display:flex;gap:5px}.day-dot{width:25px;height:25px;border-radius:8px;background:#eef0f6;color:#8993a4;display:grid;place-items:center;font-size:10px;font-weight:750}.day-dot.on{background:#dff8ed;color:#11865b}.modal-backdrop{position:fixed;inset:0;background:#17203370;display:grid;place-items:center;padding:20px;z-index:5}.modal{width:min(500px,100%);background:white;border-radius:20px;padding:25px;box-shadow:0 25px 80px #11182733;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modal-head h2{font-size:20px;margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:24px;bottom:24px;background:#182238;color:white;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:10;max-width:min(420px,90vw);font-size:14px}.toast.bad{background:#9f2940}.mobile-menu{display:none}
@media(max-width:1000px){.app{grid-template-columns:210px 1fr}.content{padding:25px 22px}.topbar{padding:0 22px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:4;left:-270px;top:0;bottom:0;width:250px;transition:left .2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.mobile-menu{display:inline-block}.topbar{height:68px;padding:0 16px}.content{padding:22px 15px}.welcome{align-items:flex-start;flex-direction:column}.welcome h1{font-size:25px}.stats{gap:10px}.stat{padding:14px}.stat-num{font-size:25px}.cards{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.top-right .email-top{display:none}}
</style>
</head>
<body>
<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <div class="logo"><span class="logo-mark">✦</span> FlowTask</div>
    <h1 id="authTitle">Chào mừng trở lại</h1>
    <p id="authDesc">Đăng nhập để tiếp tục xây dựng một ngày làm việc hiệu quả hơn.</p>
    <form id="authForm">
      <div class="field" id="nameField" style="display:none"><label for="fullName">Tên của bạn</label><input id="fullName" autocomplete="name" placeholder="Nguyễn Văn A"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="ban@email.com"></div>
      <div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Ít nhất 6 ký tự"></div>
      <button class="primary" id="authSubmit" type="submit">Đăng nhập</button>
      <div class="error" id="authError"></div>
    </form>
    <div class="switch"><span id="switchText">Chưa có tài khoản?</span> <span class="link" id="switchAuth">Đăng ký</span></div>
    <div class="hint">Tài khoản được xác thực bởi Supabase Auth. Nếu dự án bật xác nhận email, hãy xác nhận email trước khi đăng nhập.</div>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="logo-mark">✦</span> FlowTask</div>
    <div><div class="nav-label">Không gian làm việc</div><nav class="nav">
      <button class="active" data-page="dashboard"><span class="ico">◫</span>Tổng quan</button>
      <button data-page="tasks"><span class="ico">☑</span>Công việc</button>
      <button data-page="notes"><span class="ico">▤</span>Ghi chú</button>
      <button data-page="goals"><span class="ico">◎</span>Mục tiêu</button>
      <button data-page="habits"><span class="ico">✳</span>Thói quen</button>
    </nav></div>
    <div class="sidebar-bottom"><div class="nav-label">Tài khoản</div><div class="user-email" id="sideEmail"></div><button class="ghost" id="logoutBtn" style="width:100%">↪ Đăng xuất</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="ghost mobile-menu" id="menuBtn">☰</button><h2 id="topTitle">Tổng quan</h2></div><div class="top-right"><span class="muted email-top" id="topEmail" style="font-size:13px"></span><div class="avatar" id="avatar">F</div></div></header>
    <div class="content" id="pageContent"></div>
  </main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
/* 1) Dán URL và anon/publishable key của dự án Supabase tại đây. KHÔNG BAO GIỜ đặt service_role key trong frontend. */
const SUPABASE_URL = "https://qpxaucofetfodmxixebt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_B-GJUyfX_vmrsfqXet-6yw_lXpCD7Av";
const configured = !SUPABASE_URL.includes("YOUR_PROJECT_ID") && !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE");
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null, currentUser = null, page = "dashboard", authMode = "login";
let tasks = [], notes = [], goals = [], habits = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateText = d => d ? new Date(d+"T00:00:00").toLocaleDateString("vi-VN",{day:"2-digit",month:"short",year:"numeric"}) : "Chưa đặt hạn";
const today = () => new Date().toISOString().slice(0,10);
function toast(msg,bad=false){$("toastRoot").innerHTML=`<div class="toast ${bad?"bad":""}">${esc(msg)}</div>`;setTimeout(()=>{$("toastRoot").innerHTML=""},3200)}
function showAuthError(msg){$("authError").textContent=msg}
function setAuthMode(mode){authMode=mode;const signup=mode==="signup";$("authTitle").textContent=signup?"Tạo tài khoản FlowTask":"Chào mừng trở lại";$("authDesc").textContent=signup?"Tạo không gian riêng để quản lý công việc và mục tiêu.":"Đăng nhập để tiếp tục xây dựng một ngày làm việc hiệu quả hơn.";$("nameField").style.display=signup?"flex":"none";$("authSubmit").textContent=signup?"Tạo tài khoản":"Đăng nhập";$("switchText").textContent=signup?"Đã có tài khoản?":"Chưa có tài khoản?";$("switchAuth").textContent=signup?"Đăng nhập":"Đăng ký";$("password").autocomplete=signup?"new-password":"current-password";showAuthError("")}
$("switchAuth").onclick=()=>setAuthMode(authMode==="login"?"signup":"login");
$("authForm").addEventListener("submit",async e=>{e.preventDefault();if(!configured){showAuthError("Bạn cần cấu hình SUPABASE_URL và SUPABASE_ANON_KEY trong index.html trước khi sử dụng.");return}const email=$("email").value.trim(),password=$("password").value;const btn=$("authSubmit");btn.disabled=true;btn.textContent="Đang xử lý…";showAuthError("");try{if(authMode==="signup"){const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:$("fullName").value.trim()}}});if(error)throw error;if(data.session){session=data.session;currentUser=data.user;await enterApp()}else{showAuthError("Đăng ký thành công. Nếu xác nhận email đang bật, hãy mở email để xác nhận rồi đăng nhập.")}}else{const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;session=data.session;currentUser=data.user;await enterApp()}}catch(err){showAuthError(err.message||"Không thể xác thực tài khoản.")}finally{btn.disabled=false;btn.textContent=authMode==="signup"?"Tạo tài khoản":"Đăng nhập"}});
$("logoutBtn").onclick=async()=>{await supabaseClient.auth.signOut();session=null;currentUser=null;$("appView").classList.add("hidden");$("authView").classList.remove("hidden");setAuthMode("login")};
$("menuBtn").onclick=()=>$("sidebar").classList.toggle("open");
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x===b));$("sidebar").classList.remove("open");renderPage()});
async function enterApp(){if(!currentUser)return;$("authView").classList.add("hidden");$("appView").classList.remove("hidden");const email=currentUser.email||"";$("sideEmail").textContent=email;$("topEmail").textContent=email;$("avatar").textContent=(email[0]||"F").toUpperCase();await loadAll();renderPage()}
async function loadAll(){try{const results=await Promise.all(["tasks","notes","goals","habits"].map(t=>supabaseClient.from(t).select("*").order("created_at",{ascending:false})));for(let i=0;i<results.length;i++){if(results[i].error)throw results[i].error;}
    tasks = results[0].data || [];
    notes = results[1].data || [];
    goals = results[2].data || [];
    habits = results[3].data || [];}catch(e){toast("Không tải được dữ liệu: "+e.message,true)}}
const titles={dashboard:"Tổng quan",tasks:"Công việc",notes:"Ghi chú",goals:"Mục tiêu",habits:"Thói quen"};
function renderPage(){ $("topTitle").textContent=titles[page]; if(page==="dashboard")renderDashboard();if(page==="tasks")renderTasks();if(page==="notes")renderNotes();if(page==="goals")renderGoals();if(page==="habits")renderHabits()}
function empty(text){return `<div class="empty">${text}</div>`}
function taskRow(t){return `<div class="task-row"><input class="check" type="checkbox" ${t.completed?"checked":""} onchange="toggleTask('${t.id}',this.checked)"><div style="flex:1;min-width:0"><div class="task-title ${t.completed?"done":""}">${esc(t.title)}</div><div class="task-meta">${t.due_date?"Hạn: "+dateText(t.due_date):"Chưa đặt hạn"} · <span class="tag ${t.priority==="Cao"?"high":t.priority==="Thấp"?"low":""}">${esc(t.priority||"Vừa")}</span></div></div><button class="icon-btn" title="Xóa" onclick="deleteItem('tasks','${t.id}')">✕</button></div>`}
function renderDashboard(){const open=tasks.filter(t=>!t.completed),done=tasks.filter(t=>t.completed),todayTasks=open.filter(t=>t.due_date===today());$("pageContent").innerHTML=`<div class="welcome"><div><h1>Chào bạn, ${esc(currentUser.user_metadata?.full_name||currentUser.email?.split("@")[0]||"bạn")} 👋</h1><p>Những bước nhỏ mỗi ngày tạo nên kết quả lớn.</p></div><button class="primary" onclick="openForm('tasks')">＋ Tạo công việc</button></div><div class="stats"><div class="stat"><div class="stat-top">Công việc đang mở <span class="stat-icon">☑</span></div><div class="stat-num">${open.length}</div><div class="stat-sub">Việc cần hoàn thành</div></div><div class="stat"><div class="stat-top">Đã hoàn thành <span class="stat-icon">✓</span></div><div class="stat-num">${done.length}</div><div class="stat-sub">Tiến độ công việc</div></div><div class="stat"><div class="stat-top">Ghi chú <span class="stat-icon">▤</span></div><div class="stat-num">${notes.length}</div><div class="stat-sub">Ý tưởng đã lưu</div></div><div class="stat"><div class="stat-top">Mục tiêu <span class="stat-icon">◎</span></div><div class="stat-num">${goals.length}</div><div class="stat-sub">Điều bạn đang hướng tới</div></div></div><div class="grid2"><section class="panel"><div class="panel-head"><h3>Việc cần làm</h3><button class="ghost" onclick="goPage('tasks')">Xem tất cả →</button></div>${open.length?`<div class="task-list">${open.slice(0,6).map(taskRow).join("")}</div>`:empty("Tuyệt vời! Bạn không còn việc nào đang mở.")}</section><section class="panel"><div class="panel-head"><h3>Mục tiêu gần đây</h3><button class="ghost" onclick="goPage('goals')">Xem mục tiêu →</button></div>${goals.length?`<div class="item-list">${goals.slice(0,4).map(g=>`<div><div style="display:flex;justify-content:space-between;gap:10px"><strong style="font-size:14px">${esc(g.title)}</strong><span class="muted" style="font-size:12px">${g.progress||0}%</span></div><div class="progress"><span style="width:${Math.min(100,Math.max(0,g.progress||0))}%"></span></div></div>`).join("")}</div>`:empty("Tạo mục tiêu đầu tiên của bạn.")}</section></div>`}
function goPage(p){page=p;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===p));renderPage()}
function renderTasks(){const sorted=[...tasks].sort((a,b)=>Number(a.completed)-Number(b.completed));$("pageContent").innerHTML=`<div class="page-head"><div><h1>Công việc</h1><p class="muted">Theo dõi ưu tiên và hoàn thành từng việc.</p></div><button class="primary" onclick="openForm('tasks')">＋ Thêm công việc</button></div><div class="filters"><input class="search" id="taskSearch" placeholder="Tìm công việc…" oninput="filterTasks()"><select id="taskFilter" onchange="filterTasks()" class="search" style="max-width:190px"><option value="all">Tất cả trạng thái</option><option value="open">Chưa hoàn thành</option><option value="done">Đã hoàn thành</option></select></div><section class="panel"><div class="task-list" id="taskRows">${sorted.length?sorted.map(taskRow).join(""):empty("Chưa có công việc. Hãy thêm việc đầu tiên!")}</div></section>`}
function filterTasks(){const q=$("taskSearch").value.toLowerCase(),f=$("taskFilter").value;const arr=[...tasks].filter(t=>t.title.toLowerCase().includes(q)&&(f==="all"||(f==="open"&&!t.completed)||(f==="done"&&t.completed))).sort((a,b)=>Number(a.completed)-Number(b.completed));$("taskRows").innerHTML=arr.length?arr.map(taskRow).join(""):empty("Không tìm thấy công việc phù hợp.")}
function renderNotes(){$("pageContent").innerHTML=`<div class="page-head"><div><h1>Ghi chú</h1><p class="muted">Lưu nhanh ý tưởng, thông tin và điều cần nhớ.</p></div><button class="primary" onclick="openForm('notes')">＋ Viết ghi chú</button></div><div class="cards">${notes.length?notes.map(n=>`<article class="item-card"><span class="tag">GHI CHÚ</span><h3>${esc(n.title)}</h3><p>${esc(n.content||"Chưa có nội dung")}</p><div class="card-foot"><span class="muted" style="font-size:11px">${dateText((n.created_at||"").slice(0,10))}</span><div><button class="icon-btn" onclick="openForm('notes','${n.id}')">✎</button><button class="icon-btn" onclick="deleteItem('notes','${n.id}')">✕</button></div></div></article>`).join(""):empty("Chưa có ghi chú nào. Ý tưởng hay bắt đầu từ đây!")}</div>`}
function renderGoals(){$("pageContent").innerHTML=`<div class="page-head"><div><h1>Mục tiêu</h1><p class="muted">Chia mục tiêu lớn thành tiến độ nhỏ có thể theo dõi.</p></div><button class="primary" onclick="openForm('goals')">＋ Tạo mục tiêu</button></div><div class="cards">${goals.length?goals.map(g=>`<article class="item-card"><span class="tag">MỤC TIÊU</span><h3>${esc(g.title)}</h3><p>${esc(g.description||"Chưa có mô tả")}</p><div style="display:flex;justify-content:space-between;font-size:12px"><span class="muted">Tiến độ</span><strong>${g.progress||0}%</strong></div><div class="progress"><span style="width:${Math.min(100,Math.max(0,g.progress||0))}%"></span></div><div class="card-foot"><span class="muted" style="font-size:11px">${g.target_date?"Hạn: "+dateText(g.target_date):"Không có hạn"}</span><div><button class="icon-btn" onclick="openForm('goals','${g.id}')">✎</button><button class="icon-btn" onclick="deleteItem('goals','${g.id}')">✕</button></div></div></article>`).join(""):empty("Bạn muốn đạt được điều gì? Hãy tạo mục tiêu đầu tiên.")}</div>`}
function renderHabits(){$("pageContent").innerHTML=`<div class="page-head"><div><h1>Thói quen</h1><p class="muted">Xây dựng nhịp điệu tốt bằng những hành động lặp lại.</p></div><button class="primary" onclick="openForm('habits')">＋ Thêm thói quen</button></div><section class="panel"><div class="panel-head"><h3>Danh sách thói quen</h3><span class="muted" style="font-size:12px">Đánh dấu khi hoàn thành hôm nay</span></div>${habits.length?habits.map(h=>`<div class="habit-row"><div class="habit-emoji">${esc(h.emoji||"✳")}</div><div class="habit-info"><strong>${esc(h.title)}</strong><p>${esc(h.description||"Mỗi ngày tiến một chút")}</p></div><label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)"><input class="check" type="checkbox" ${h.last_done===today()?"checked":""} onchange="markHabit('${h.id}',this.checked)"> Hôm nay</label><button class="icon-btn" onclick="openForm('habits','${h.id}')">✎</button><button class="icon-btn" onclick="deleteItem('habits','${h.id}')">✕</button></div>`).join(""):empty("Bắt đầu với một thói quen nhỏ mà bạn muốn duy trì.")}</section>`}
async function saveRow(table,id,payload){let res;if(id)res=await supabaseClient.from(table).update(payload).eq("id",id).select().single();else res=await supabaseClient.from(table).insert({...payload,user_id:currentUser.id}).select().single();if(res.error)throw res.error;await loadAll();renderPage();toast(id?"Đã cập nhật!":"Đã lưu thành công!")}
function openForm(table,id=null){const list={tasks,notes,goals,habits}[table];const item=id?list.find(x=>x.id===id):null;let title=item?.title||"",description=item?.description||"",content=item?.content||"",due=item?.due_date||"",priority=item?.priority||"Vừa",progress=item?.progress||0,emoji=item?.emoji||"✳";
let fields="";
if(table==="tasks")fields=`<div class="field"><label>Tên công việc *</label><input name="title" required maxlength="160" value="${esc(title)}" placeholder="Ví dụ: Hoàn thành bản kế hoạch"></div><div class="field"><label>Ngày đến hạn</label><input type="date" name="due_date" value="${esc(due)}"></div><div class="field"><label>Mức ưu tiên</label><select name="priority"><option ${priority==="Thấp"?"selected":""}>Thấp</option><option ${priority==="Vừa"?"selected":""}>Vừa</option><option ${priority==="Cao"?"selected":""}>Cao</option></select></div>`;
if(table==="notes")fields=`<div class="field"><label>Tiêu đề *</label><input name="title" required maxlength="160" value="${esc(title)}" placeholder="Ý tưởng mới…"></div><div class="field"><label>Nội dung</label><textarea name="content" rows="5" maxlength="10000" placeholder="Viết điều bạn muốn lưu…">${esc(content)}</textarea></div>`;
if(table==="goals")fields=`<div class="field"><label>Tên mục tiêu *</label><input name="title" required maxlength="160" value="${esc(title)}" placeholder="Ví dụ: Đọc 12 cuốn sách"></div><div class="field"><label>Mô tả</label><textarea name="description" rows="3" maxlength="3000">${esc(description)}</textarea></div><div class="field"><label>Ngày mục tiêu</label><input type="date" name="target_date" value="${esc(item?.target_date||"")}"></div><div class="field"><label>Tiến độ (%)</label><input type="number" name="progress" min="0" max="100" value="${progress}"></div>`;
if(table==="habits")fields=`<div class="field"><label>Tên thói quen *</label><input name="title" required maxlength="160" value="${esc(title)}" placeholder="Ví dụ: Đọc sách 15 phút"></div><div class="field"><label>Biểu tượng (emoji)</label><input name="emoji" maxlength="8" value="${esc(emoji)}"></div><div class="field"><label>Mô tả</label><textarea name="description" rows="3" maxlength="1000">${esc(description)}</textarea></div>`;
$("modalRoot").innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal"><div class="modal-head"><h2>${id?"Chỉnh sửa":"Tạo mới"} ${({tasks:"công việc",notes:"ghi chú",goals:"mục tiêu",habits:"thói quen"})[table]}</h2><button class="icon-btn" onclick="closeModal()">✕</button></div><form id="itemForm">${fields}<div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Hủy</button><button class="primary" type="submit">Lưu lại</button></div></form></section></div>`;
$("backdrop").addEventListener("click",e=>{if(e.target.id==="backdrop")closeModal()});$("itemForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),v=Object.fromEntries(fd.entries());try{let payload={};if(table==="tasks")payload={title:v.title,due_date:v.due_date||null,priority:v.priority||"Vừa",completed:item?.completed||false};if(table==="notes")payload={title:v.title,content:v.content||""};if(table==="goals")payload={title:v.title,description:v.description||"",target_date:v.target_date||null,progress:Math.min(100,Math.max(0,Number(v.progress)||0))};if(table==="habits")payload={title:v.title,emoji:v.emoji||"✳",description:v.description||"",last_done:item?.last_done||null};await saveRow(table,id,payload);closeModal()}catch(err){toast("Lỗi lưu dữ liệu: "+err.message,true)}}}
function closeModal(){$("modalRoot").innerHTML=""}
async function toggleTask(id,checked){try{const {error}=await supabaseClient.from("tasks").update({completed:checked}).eq("id",id);if(error)throw error;await loadAll();renderPage()}catch(e){toast(e.message,true)}}
async function markHabit(id,checked){try{const {error}=await supabaseClient.from("habits").update({last_done:checked?today():null}).eq("id",id);if(error)throw error;await loadAll();renderPage()}catch(e){toast(e.message,true)}}
async function deleteItem(table,id){if(!confirm("Bạn có chắc muốn xóa mục này?"))return;try{const {error}=await supabaseClient.from(table).delete().eq("id",id);if(error)throw error;await loadAll();renderPage();toast("Đã xóa.")}catch(e){toast("Không thể xóa: "+e.message,true)}}
supabaseClient.auth.getSession().then(async({data})=>{if(data.session){session=data.session;currentUser=data.session.user;await enterApp()}});
supabaseClient.auth.onAuthStateChange(async(event,newSession)=>{if(event==="SIGNED_IN"&&newSession&&!currentUser){session=newSession;currentUser=newSession.user;await enterApp()}});
</script>
</body></html>
